version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: guardee-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: guardee
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: php:8.2-apache
    container_name: guardee-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:80"
    environment:
      - CI_ENVIRONMENT=development
    depends_on:
      - mysql

  frontend:
    image: node:18-alpine
    container_name: guardee-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: npm start
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api

volumes:
  mysql_data:
